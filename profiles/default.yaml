# Профиль по умолчанию. Формат — README.md рядом с инспектором.
#
# Пустой намеренно: без объявлений инспектор не выдаёт и не снимает ничего,
# и это его честное состояние по умолчанию. Существовать он обязан —
# поколение без него инспектор отвергает целиком.
#
# Профиль устроен в два уровня. cookies: — что это за кука (имя, срок, чем
# заполняется значение, чем подписывается). rules: — когда её выдать или
# снять и о чём при этом рассказать соседям.
#
# Пример: считать рекламный трафик. Кука выдаётся тому, у кого её нет
# (on: absent — «первое касание»), метка берётся из utm_source, значение
# подписывается, событие помечается маркером, а значение кладётся в живой
# набор, по которому край узнаёт клиента без похода на шину.
#
#   cookies:
#     - name: waf_src
#       max_age: 30d
#       value:
#         from: $arg_utm_source
#         default: direct
#         random: 8
#   rules:
#     - name: first-touch
#       on: absent
#       issue: waf_src
#       actions:
#         - do: mark
#           marker: "src:{tag}"
#         - list: ads_clients
#           write: cookie
#           ttl: 30d
#           code: COOKIE_ADS
#
# Снятие — та же форма с drop: кука уходит пустым значением и Max-Age=0,
# а запись из набора снимается op: remove.
#
#   rules:
#     - name: logout
#       match: { path_prefix: "/logout" }
#       drop: waf_src
#       actions:
#         - list: ads_clients
#           write: cookie
#           op: remove

mode: enforce
cookies: []
rules: []
